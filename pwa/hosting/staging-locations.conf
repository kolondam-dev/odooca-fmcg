# Include inside the existing staging HTTPS server block; upstream hostnames
# must be replaced by the deployment owner. Odoo requires proxy_mode=True.
# The gateway must terminate TLS itself or use a trusted, correctly configured
# TLS terminator. Never trust arbitrary client-supplied forwarded headers.
location /field/ {
    proxy_pass http://field-pwa:8080;
    proxy_set_header Host $http_host;
    # Odoo19 enables ProxyFix only when X-Forwarded-Host is present.
    proxy_set_header X-Forwarded-Host $http_host;
    # Do not pass alternative client-supplied proxy authority/prefix headers.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location ~ ^/api/v1/(me/bootstrap|sync/snapshot)$ {
    limit_except GET { deny all; }
    proxy_pass http://odoo:8069;
    proxy_set_header Host $http_host;
    # Odoo19 enables ProxyFix only when X-Forwarded-Host is present.
    proxy_set_header X-Forwarded-Host $http_host;
    # Do not pass alternative client-supplied proxy authority/prefix headers.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location = /api/v1/evidence {
    limit_except POST { deny all; }
    client_max_body_size 6m;
    proxy_pass http://odoo:8069;
    proxy_set_header Host $http_host;
    # Odoo19 enables ProxyFix only when X-Forwarded-Host is present.
    proxy_set_header X-Forwarded-Host $http_host;
    # Do not pass alternative client-supplied proxy authority/prefix headers.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location ~ "^/api/v1/evidence/[0-9a-f-]{36}/(original|watermarked)$" {
    limit_except GET { deny all; }
    proxy_pass http://odoo:8069;
    proxy_set_header Host $http_host;
    # Odoo19 enables ProxyFix only when X-Forwarded-Host is present.
    proxy_set_header X-Forwarded-Host $http_host;
    # Do not pass alternative client-supplied proxy authority/prefix headers.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
# Evidence is explicitly allowed; business command endpoints remain unavailable.
location /api/ { return 404; }
# Native Odoo login, session cookie and assets remain on the same origin.
location / {
    proxy_pass http://odoo:8069;
    proxy_set_header Host $http_host;
    # Odoo19 enables ProxyFix only when X-Forwarded-Host is present.
    proxy_set_header X-Forwarded-Host $http_host;
    # Do not pass alternative client-supplied proxy authority/prefix headers.
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
