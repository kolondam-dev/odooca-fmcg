# CI repo publik: tanpa secret. PR dari fork berjalan tanpa akses ke Railway.
# STATUS: BELUM DIJALANKAN (draf M0). Verifikasi versi action dan image saat run pertama.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang alat
        run: pip install ruff==0.6.9 pyyaml
      - name: Lint
        run: ruff check .
      - name: Manifest addon
        run: python scripts/check_manifests.py
      - name: Kontrak runner upgrade modul (unit)
        run: python -m unittest tests.test_full_dataset_cutoff_and_upgrade.TestUpgradeBaselineRunner -v
      - name: Sintaks shell
        run: bash -n deploy/init.sh deploy/addons_path.sh scripts/fetch_oca.sh scripts/oca_bump.sh scripts/agent/*.sh scripts/sandbox/*.sh
      - name: Validitas YAML
        run: python -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')+['docker-compose.yml']]"

  install-test:
    needs: static
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fmcg-odoo:ci .
      - name: Instal dan uji addon id_* pada DB kosong
        run: |
          set -o pipefail
          docker run --rm -v ui-filestore:/var/lib/odoo --network host --entrypoint bash fmcg-odoo:ci -c '
            odoo -d ci_db --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --without-demo=true \
              -i id_base,id_approval,id_ui_form,id_mobile_api,id_promo_governance,sale_management,account,fleet,l10n_id --test-tags /id_base,/id_approval,/id_ui,/id_ui_shell,/id_mobile_api,/id_promo_governance --stop-after-init --log-level=test
          ' 2>&1 | tee odoo.log
      - name: Log harus bersih
        run: |
          if grep -E " (ERROR|CRITICAL) |Traceback" odoo.log; then
            echo "Ditemukan ERROR/Traceback pada log"; exit 1
          fi
      - name: Disposable mobile staging provisioning shell smoke
        run: |
          set -o pipefail
          docker run --rm --network host --entrypoint bash fmcg-odoo:ci -c '
            set -euo pipefail
            PGPASSWORD=odoo createdb -h localhost -p 5432 -U odoo -T ci_db fmcg_staging_acceptance
            odoo shell -d fmcg_staging_acceptance --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http < /opt/scripts/ops/verify_mobile_staging.py
          ' 2>&1 | tee staging-provision.log
          grep -q 'STAGING_PROVISION_SMOKE=PASS' staging-provision.log
          if grep -E ' (ERROR|CRITICAL) |Traceback' staging-provision.log; then exit 1; fi
      - name: Existing-demo provisioning preservation smoke
        run: |
          set -o pipefail
          docker run --rm --network host --entrypoint bash fmcg-odoo:ci -c '
            set -euo pipefail
            PGPASSWORD=odoo createdb -h localhost -p 5432 -U odoo -T ci_db fmcg_demo_acceptance
            odoo shell -d fmcg_demo_acceptance --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http < /opt/scripts/ops/verify_mobile_demo.py
          ' 2>&1 | tee existing-demo.log
          grep -q 'EXISTING_DEMO_PROVISION=PASS' existing-demo.log
          if grep -E ' (ERROR|CRITICAL) |Traceback' existing-demo.log; then exit 1; fi
      - name: Prepare disposable UI fixtures
        run: |
          set -o pipefail
          docker run --rm -i -v ui-filestore:/var/lib/odoo --network host --entrypoint bash fmcg-odoo:ci -c '
            odoo shell -d ci_db --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ui/smoke_fixture.py | tee fixture.log
          python -c 'import json; d=json.loads(next(x.split("UI_FIXTURE=",1)[1] for x in open("fixture.log") if x.startswith("UI_FIXTURE="))); print(d["order"])' > ui-order.txt
          python -c 'import json; d=json.loads(next(x.split("UI_FIXTURE=",1)[1] for x in open("fixture.log") if x.startswith("UI_FIXTURE="))); print(d["invoice"])' > ui-invoice.txt
      - name: Start Odoo for browser smoke
        run: |
          docker run -d --name ui-smoke -v ui-filestore:/var/lib/odoo --network host --entrypoint bash fmcg-odoo:ci -c '
            exec odoo -d ci_db --db-filter "^ci_db$" --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --http-interface 127.0.0.1 --http-port 8069 --max-cron-threads 0
          '
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8069/web/login; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:8069/web/login
      - name: Browser smoke (UI modules, two-record pager, classic/sidebar)
        env:
          UI_TEST_PASSWORD: ci-ui
        run: |
          pip install playwright==1.58.0 libsass==0.23.0
          python -m playwright install --with-deps chromium
          python -m unittest discover -s docs/ui/e2e -p 'test_*.py' -v
          python docs/ui/e2e/smoke_ui.py http://localhost:8069 "$(cat ui-order.txt)" "$(cat ui-invoice.txt)"
      - name: UI runtime diagnostics
        if: always()
        run: |
          docker logs ui-smoke > ui-runtime.log 2>&1 || true
          docker rm -f ui-smoke || true
          docker volume rm ui-filestore || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-diagnostics
          path: |
            fixture.log
            odoo.log
            ui-runtime.log
            ui-smoke-failure.png

  init-test:
    # Meniru uji sandbox A dan B: init.sh pada DB kosong (build penuh) lalu restart (semua langkah dilewati).
    needs: static
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fmcg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fmcg-odoo:ci .
      - name: init.sh pada DB kosong (build penuh)
        run: |
          docker run -d --name odoo --network host \
            -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=ci-postgres -e PGDATABASE=fmcg \
            -e ODOO_DB_USER=odoo_app -e ODOO_DB_PASSWORD=ci-app -e ADMIN_PASSWD=ci-master \
            -e ADMIN_LOGIN_PASSWORD=ci-admin -e BASE_URL=http://ci.example.test \
            -e INIT_MODULES=id_base,l10n_id,sale_management,stock,purchase,account,product_expiry,stock_account fmcg-odoo:ci
          for i in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8069/web/login)" = "200" ] && break
            sleep 5
          done
          docker logs odoo > init1.log 2>&1
          curl -sf -o /dev/null http://localhost:8069/web/login || { tail -n 100 init1.log; exit 1; }
          grep -q "tanpa dump: build penuh" init1.log
      - name: Restart idempoten
        run: |
          docker restart odoo
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8069/web/login)" = "200" ] && break
            sleep 3
          done
          docker logs odoo > init2.log 2>&1
          curl -sf -o /dev/null http://localhost:8069/web/login || { tail -n 100 init2.log; exit 1; }
          grep -q "init.base sudah ada; lewati" init2.log
      - name: Log harus bersih
        run: |
          cat init1.log init2.log > init.log
          if grep -E " (ERROR|CRITICAL) |Traceback" init.log; then exit 1; fi
      - name: Siapkan database terisolasi untuk eksperimen
        run: |
          docker exec -e PGUSER=postgres -e PGPASSWORD=ci-postgres odoo psql -h localhost -U postgres -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='fmcg' AND pid <> pg_backend_pid();"
          docker exec -e PGUSER=postgres -e PGPASSWORD=ci-postgres odoo dropdb -h localhost -U postgres --if-exists fmcg_exp
          docker exec -e PGUSER=postgres -e PGPASSWORD=ci-postgres odoo createdb -h localhost -U postgres -O odoo_app -T fmcg fmcg_exp
      - name: Eksekusi eksperimen seeding historis minimal pada Odoo 19 disposable
        run: |
          set -o pipefail
          docker exec -i -e PGDATABASE=fmcg_exp odoo /opt/deploy/init.sh shell --no-http < scripts/ops/verify_historical_experiment.py 2>&1 | tee experiment.log
      - name: Ekstraksi laporan eksperimen historis
        if: always()
        run: |
          docker exec odoo cat /tmp/historical_experiment_report.json > historical_experiment_report.json 2>/dev/null || docker exec odoo cat historical_experiment_report.json > historical_experiment_report.json 2>/dev/null || true
          [ -s historical_experiment_report.json ] || echo "[WARN] Laporan eksperimen historis kosong"
      - name: Upload artifact diagnostik eksperimen historis Odoo 19
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo19-historical-experiment-report
          path: |
            historical_experiment_report.json
            experiment.log
          retention-days: 14
      - name: Eksekusi dan verifikasi slice representatif pada Odoo 19 disposable
        run: |
          set -o pipefail
          docker exec -i odoo /opt/deploy/init.sh shell --no-http < scripts/ops/verify_disposable_slice.py 2>&1 | tee slice_runtime.log
      - name: Upload artifact verifikasi runtime disposable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo19-disposable-slice-log
          path: |
            slice_runtime.log
            init.log
          retention-days: 14
