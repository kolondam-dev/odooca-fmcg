name: Finance I0 candidate spike
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'addons/id_base/**'
      - 'addons/id_finance_reporting/**'
      - 'addons/id_finance_foundation/**'
      - 'scripts/ops/finance_activation.py'
      - 'scripts/ops/verify_finance_foundation.py'
      - 'tests/test_finance_activation.py'
      - 'scripts/ops/finance_i0*'
      - 'scripts/ops/verify_finance_golden_ledger.py'
      - 'scripts/ops/verify_finance_ledger_security.py'
      - 'scripts/ops/verify_finance_stock_bridge.py'
      - 'scripts/ops/verify_finance_i2_ledgers_core.py'
      - 'scripts/ops/verify_finance_i2_arap_subledger.py'
      - 'scripts/ops/verify_finance_i2c_schedules.py'
      - 'tests/test_finance_i2c_schedules.py'
      - 'tests/test_finance_stock_bridge.py'
      - 'tests/test_finance_golden_ledger.py'
      - 'tests/test_finance_i2_ledgers_core.py'
      - 'tests/test_finance_i2_arap_subledger.py'
      - 'tests/test_finance_report_scope.py'
      - 'docs/finance/**'
      - 'oca.lock'
      - '.github/workflows/finance-i0-spike.yml'
permissions:
  contents: read
concurrency:
  group: finance-i0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate-install-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned project image
        run: docker build -t fmcg-finance:i0 .
      - name: Install separate candidate profiles and upgrade persisted databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p finance-i0-evidence
          profiles=(
            'reports:account_financial_report,account_tax_balance,partner_statement,id_mobile_api,id_finance_reporting,purchase_stock'
            'mis:mis_builder,mis_builder_budget,mis_builder_cash_flow'
            'bank:account_reconcile_oca,account_statement_import_sheet_file_xlsx'
            'credit:account_credit_control,sale_financial_risk'
            'native:l10n_id_efaktur_coretax,stock_landed_costs,hr_expense,payroll'
            'foundation:id_finance_foundation'
          )
          for profile in "${profiles[@]}"; do
            name="${profile%%:*}"
            modules="id_base,l10n_id,${profile#*:}"
            for mode in install upgrade; do
              flag=-i
              if [ "$mode" = upgrade ]; then flag=-u; fi
              docker run --rm --network host --entrypoint bash fmcg-finance:i0 -c '
                odoo -d "$1" --db_host localhost --db_port 5432 -r odoo -w odoo \
                  --addons-path "$(/opt/deploy/addons_path.sh)" --without-demo=true \
                  "$2" "$3" --stop-after-init --no-http
              ' -- "finance_i0_${name}_disposable" "$flag" "$modules" \
                2>&1 | tee "finance-i0-evidence/${name}-${mode}.log"
              if grep -E ' (ERROR|CRITICAL) |Traceback' "finance-i0-evidence/${name}-${mode}.log"; then exit 1; fi
            done
            docker run --rm --network host --entrypoint python3 \
              -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=odoo -e PGPASSWORD=odoo \
              -e PGDATABASE="finance_i0_${name}_disposable" \
              fmcg-finance:i0 /opt/scripts/ops/finance_i0_inventory.py \
              > "finance-i0-evidence/${name}-inventory.json"
            python - "$modules" "finance-i0-evidence/${name}-inventory.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[2]))
          installed = {r['name'] for r in report['database']['modules'] if r['state'] == 'installed'}
          missing = set(sys.argv[1].split(',')) - installed
          assert not missing, f'Candidate install silently skipped: {missing}'
          assert not report['errors'], report['errors']
          print('FINANCE_I0_PROFILE_INSTALLED_AND_UPGRADED', sys.argv[1])
          PY
          done
      - name: Persisted finance foundation activation and upgrade preservation
        run: |
          set -euo pipefail
          index=0
          for phase in prepare install verify upgrade verify; do
            index=$((index + 1))
            if [ "$phase" = install ] || [ "$phase" = upgrade ]; then
              flag=-i; if [ "$phase" = upgrade ]; then flag=-u; fi
              docker run --rm --network host --entrypoint bash fmcg-finance:i0 -c '
                odoo -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
                  --addons-path "$(/opt/deploy/addons_path.sh)" --without-demo=true \
                  "$1" id_finance_foundation --stop-after-init --no-http
              ' -- "$flag" 2>&1 | tee "finance-i0-evidence/foundation-${index}-${phase}.log"
            else
              docker run --rm -i --network host --entrypoint bash -e FINANCE_FOUNDATION_PHASE="$phase" fmcg-finance:i0 -c '
                odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
                  --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
              ' < scripts/ops/verify_finance_foundation.py 2>&1 | tee "finance-i0-evidence/foundation-${index}-${phase}.log"
              if [ "$phase" = prepare ]; then marker=FINANCE_FOUNDATION_PREPARE; else marker=FINANCE_FOUNDATION; fi
              grep -q "^${marker}=PASS$" "finance-i0-evidence/foundation-${index}-${phase}.log"
            fi
          done
      - name: Minimal golden ledger against actual OCA Trial Balance
        run: |
          set -euo pipefail
          docker run --rm -i --network host --entrypoint bash fmcg-finance:i0 -c '
            odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ops/verify_finance_golden_ledger.py 2>&1 | tee finance-i0-evidence/golden-ledger.log
          grep -q '^FINANCE_GOLDEN_LEDGER=PASS$' finance-i0-evidence/golden-ledger.log
      - name: Company isolation, roles and native invoice payment ledger
        run: |
          set -euo pipefail
          docker run --rm -i --network host --entrypoint bash fmcg-finance:i0 -c '
            odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ops/verify_finance_ledger_security.py 2>&1 | tee finance-i0-evidence/ledger-security.log
          grep -q '^FINANCE_LEDGER_SECURITY=PASS$' finance-i0-evidence/ledger-security.log
      - name: Native costing ownership and stock journal bridge
        run: |
          set -euo pipefail
          docker run --rm -i --network host --entrypoint bash fmcg-finance:i0 -c '
            odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ops/verify_finance_stock_bridge.py 2>&1 | tee finance-i0-evidence/stock-bridge.log
          grep -q '^FINANCE_STOCK_BRIDGE=PASS$' finance-i0-evidence/stock-bridge.log
      - name: I2a core ledgers, audit trail, combined TB and sales/purchase register
        run: |
          set -euo pipefail
          docker run --rm -i --network host --entrypoint bash fmcg-finance:i0 -c '
            odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ops/verify_finance_i2_ledgers_core.py 2>&1 | tee finance-i0-evidence/i2a-ledgers-core.log
          grep -q '^FINANCE_I2A_LEDGERS_CORE=PASS$' finance-i0-evidence/i2a-ledgers-core.log
      - name: I2b AR/AP subledger, dated open items and signed aging
        run: |
          set -euo pipefail
          docker run --rm -i --network host --entrypoint bash fmcg-finance:i0 -c '
            odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ops/verify_finance_i2_arap_subledger.py 2>&1 | tee finance-i0-evidence/i2b-arap-subledger.log
          grep -q '^FINANCE_I2B_ARAP_SUBLEDGER=PASS$' finance-i0-evidence/i2b-arap-subledger.log
      - name: I2c accrual schedules and FX revaluation
        run: |
          set -euo pipefail
          docker run --rm -i --network host --entrypoint bash fmcg-finance:i0 -c '
            odoo shell -d finance_i0_reports_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --no-http
          ' < scripts/ops/verify_finance_i2c_schedules.py 2>&1 | tee finance-i0-evidence/i2c-schedules.log
          grep -q '^FINANCE_I2C_SCHEDULES=PASS$' finance-i0-evidence/i2c-schedules.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-i0-candidate-evidence
          path: finance-i0-evidence/
