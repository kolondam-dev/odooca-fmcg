name: Android native

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      force_all:
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or SHA to verify
        required: false
        type: string
      force_all:
        description: Run Android suite regardless of diff
        required: false
        default: true
        type: boolean
      emulator_smoke:
        description: Run optional emulator smoke on API 24 and 35
        type: boolean
        default: false
      emulator_ui:
        description: Also run initial UI instrumentation when emulator smoke is enabled
        type: boolean
        default: false
      b09:
        description: Run optional APK to disposable Odoo over HTTPS
        type: boolean
        default: false
      b09_api:
        description: Emulator API for the B09 job
        type: choice
        default: '35'
        options: ['35', '24']
      device_fixture:
        description: Build the POCO M3 fixture APKs
        type: boolean
        default: false
      device_database:
        description: Disposable database from the fixture handoff
        type: string
      device_ca_base64:
        description: Base64 of the fixture PUBLIC CA PEM certificate
        type: string
      device_origin:
        description: Approved direct HTTPS origin for system TLS; leave empty for loopback
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Android impact plan
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Select Android suite
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ inputs.force_all || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'android-ci') }}
        run: |
          args=()
          if [ "$FORCE_ALL" = "true" ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--force-suite android --files)
          else
            args+=(--base "$BASE_SHA" --head HEAD)
          fi
          python scripts/ci/plan.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  guards:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Android suite not selected
        if: needs.changes.outputs.android != 'true'
        run: echo "PASS — no Android or shared-contract path changed; see impact plan."
      - uses: gradle/actions/wrapper-validation@v6
        if: needs.changes.outputs.android == 'true'
      - name: Design tokens match the shared source
        if: needs.changes.outputs.android == 'true'
        run: |
          python android/tools/gen_design_tokens.py pwa/design/tokens.json /tmp/Tokens.kt
          diff -u android/core/designsystem/src/main/kotlin/com/kolondam/odooca/field/designsystem/Tokens.kt /tmp/Tokens.kt
      - name: Reject replacement data paths
        if: needs.changes.outputs.android == 'true'
        run: |
          if grep -rniE "mock|demo|dummy|fake|stub|simulat" android \
             --include='*.kt' --include='*.kts' --include='*.xml' \
             --include='*.toml' --include='*.md' --include='*.py' \
             | grep -v 'device/LocationCollector.kt' \
             | grep -v 'android/README.md'; then
            echo "Forbidden replacement-data term found in Android sources" >&2
            exit 1
          fi

  domain-tests:
    if: needs.changes.outputs.android == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run pure Kotlin domain tests with warnings as errors
        working-directory: android
        run: ./gradlew --no-daemon :core:domain:test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate generated payloads against OpenAPI
        run: |
          python -m pip install jsonschema==4.23.0
          python android/tools/validate_contract.py pwa/contracts/openapi.json android/core/domain/build/contract-samples
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-domain-reports-${{ github.sha }}
          path: |
            android/core/domain/build/reports/tests/
            android/core/domain/build/test-results/
            android/core/domain/build/contract-samples/
          if-no-files-found: warn
          retention-days: 14

  data-tests:
    if: needs.changes.outputs.android == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run Room and session data-layer tests
        working-directory: android
        run: ./gradlew --no-daemon :core:data:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-data-reports-${{ github.sha }}
          path: |
            android/core/data/build/reports/tests/
            android/core/data/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    if: needs.changes.outputs.android == 'true'
    needs: [changes, guards, domain-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Lint and assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug -Podooca.baseUrl=https://ci.invalid
      - name: Record APK checksum and manifest
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"
          unzip -l "$apk" > android/app/build/outputs/apk/debug/app-debug.manifest.txt
      - uses: actions/upload-artifact@v7
        with:
          name: odooca-field-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/app-debug.manifest.txt
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

  android-gate:
    if: always()
    needs: [changes, guards, domain-tests, data-tests, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected Android gates or record intentional no-op
        env:
          SELECTED: ${{ needs.changes.outputs.android }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          DOMAIN_RESULT: ${{ needs.domain-tests.result }}
          DATA_RESULT: ${{ needs.data-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$GUARDS_RESULT" = success
          if [ "$SELECTED" != "true" ]; then
            test "$DOMAIN_RESULT" = skipped
            test "$DATA_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
            echo "PASS — Android suite intentionally not selected."
          else
            test "$DOMAIN_RESULT" = success
            test "$DATA_RESULT" = success
            test "$BUILD_RESULT" = success
          fi

  emulator-smoke:
    name: Optional emulator smoke (API ${{ matrix.api }})
    if: github.event_name == 'workflow_dispatch' && inputs.emulator_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    env:
      SMOKE_MODE: ${{ inputs.emulator_ui && 'ui' || 'smoke' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Initialize evidence
        env:
          API: ${{ matrix.api }}
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/odooca-smoke-evidence"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "ANDROID_HOME=$RUNNER_TEMP/odooca-smoke-sdk"
            echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/odooca-smoke-sdk"
            echo "EVIDENCE_DIR=$EVIDENCE_DIR"
          } >> "$GITHUB_ENV"
          printf 'sha\t%s\napi\t%s\nabi\tx86_64\nimage\tsystem-images;android-%s;google_apis;x86_64\n' \
            "$(git rev-parse HEAD)" "$API" "$API" > "$EVIDENCE_DIR/runner.tsv"
          printf 'runner_image\t%s\nrunner_revision\t%s\n' \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" >> "$EVIDENCE_DIR/runner.tsv"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM for this runner user
        run: |
          if [[ ! -c /dev/kvm ]] || ! sudo setfacl -m "u:$(id -un):rw" /dev/kvm; then
            printf 'runner_kvm_access\tFAIL\n' >> "$EVIDENCE_DIR/runner.tsv"
            exit 1
          fi
          printf 'runner_kvm_access\tPASS\n' >> "$EVIDENCE_DIR/runner.tsv"
      - name: Install Android SDK and system image
        env:
          API: ${{ matrix.api }}
        run: |
          bash android/tools/install_emulator_sdk.sh "$API"
      - name: Boot, install and verify Login
        env:
          API: ${{ matrix.api }}
        run: bash android/tools/emulator_smoke.sh "$API" "$EVIDENCE_DIR" "$SMOKE_MODE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: odooca-emulator-api-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/odooca-smoke-evidence
          if-no-files-found: error
          retention-days: 14

  apk-odoo:
    name: Optional B09 APK to Odoo (API ${{ inputs.b09_api }})
    if: github.event_name == 'workflow_dispatch' && inputs.b09
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      API: ${{ inputs.b09_api }}
      DEV02A_EXPECTED_SHA: ${{ inputs.ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      DEV02A_ODOO_IMAGE: odooca-fmcg-odoo:b09
      DEV02A_POSTGRES_IMAGE: postgres:16
    steps:
      - name: Validate dispatch revision
        run: |
          [[ "$DEV02A_EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$DEV02A_EXPECTED_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$API" == 24 || "$API" == 35 ]]
          printf 'ANDROID_HOME=%s/odooca-b09-sdk\nANDROID_SDK_ROOT=%s/odooca-b09-sdk\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'sha=%s\napi=%s\n' "$DEV02A_EXPECTED_SHA" "$API" > "$RUNNER_TEMP/b09-preflight.txt"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          printf 'kvm_access=passed\n' >> "$RUNNER_TEMP/b09-preflight.txt"
      - name: Install pinned emulator tools
        run: bash android/tools/install_emulator_sdk.sh "$API"
      - name: Build Odoo runtime and pull PostgreSQL
        run: |
          docker build -t "$DEV02A_ODOO_IMAGE" .
          docker pull "$DEV02A_POSTGRES_IMAGE"
      - name: Verify APK receipts and replay on disposable HTTPS
        run: bash android/tools/verify_dev02a_runner.sh "$API" "$RUNNER_TEMP/b09-evidence"
      - name: Record preflight failure if the runner did not start
        if: always()
        run: |
          if [[ ! -s "$RUNNER_TEMP/b09-evidence/result.txt" ]]; then
            mkdir -p "$RUNNER_TEMP/b09-evidence"
            printf 'result=failed phase=preflight_or_interrupted\ncleanup=unverified\n' \
              > "$RUNNER_TEMP/b09-evidence/result.txt"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: odooca-b09-api${{ inputs.b09_api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/b09-preflight.txt
            ${{ runner.temp }}/b09-evidence/run.tsv
            ${{ runner.temp }}/b09-evidence/result.txt
            ${{ runner.temp }}/b09-evidence/cleanup.tsv
            ${{ runner.temp }}/b09-evidence/apk.sha256
            ${{ runner.temp }}/b09-evidence/first.xml
            ${{ runner.temp }}/b09-evidence/replay.xml
            ${{ runner.temp }}/b09-evidence/first.json
            ${{ runner.temp }}/b09-evidence/replay.json
            ${{ runner.temp }}/b09-evidence/before.json
            ${{ runner.temp }}/b09-evidence/after.json
            ${{ runner.temp }}/b09-evidence/after_replay.json
            ${{ runner.temp }}/b09-evidence/verifier.json
          if-no-files-found: error
          retention-days: 14

  device-fixture-apk:
    name: Optional POCO M3 fixture APKs
    if: github.event_name == 'workflow_dispatch' && inputs.device_fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate exact workflow revision
        env:
          FIXTURE_SHA: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$FIXTURE_SHA" =~ ^[a-f0-9]{40}$ && "$FIXTURE_SHA" == "$WORKFLOW_SHA" ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build fixture APKs
        env:
          FIXTURE_SHA: ${{ inputs.ref }}
          FIXTURE_DB: ${{ inputs.device_database }}
          FIXTURE_CA_BASE64: ${{ inputs.device_ca_base64 }}
          FIXTURE_ORIGIN: ${{ inputs.device_origin }}
        run: |
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          umask 077
          if [[ -n "$FIXTURE_ORIGIN" ]]; then
            test -z "$FIXTURE_CA_BASE64"
            bash android/tools/build_dev02b_device_apk.sh --origin "$FIXTURE_ORIGIN" \
              "$FIXTURE_DB" "$RUNNER_TEMP/poco-apk"
          else
            test -n "$FIXTURE_CA_BASE64"
            ca=$(mktemp)
            trap 'rm -f -- "$ca"' EXIT
            printf '%s' "$FIXTURE_CA_BASE64" | base64 --decode > "$ca"
            bash android/tools/build_dev02b_device_apk.sh "$FIXTURE_DB" "$ca" "$RUNNER_TEMP/poco-apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: poco-fixture-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/poco-apk/poco-fixture.apk
            ${{ runner.temp }}/poco-apk/poco-fixture-test.apk
            ${{ runner.temp }}/poco-apk/apk.sha256
            ${{ runner.temp }}/poco-apk/build.txt
          if-no-files-found: error
          retention-days: 3
