name: Period Pack Runtime Verification

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or SHA to verify
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "data/registers/periods/**"
      - "scripts/ops/load_period_pack.py"
      - "scripts/ops/verify_disposable_period_pack.py"
      - "tests/test_period_pack_loader.py"
      - ".github/workflows/period-pack-runtime.yml"
  pull_request:
    paths:
      - "data/registers/periods/**"
      - "scripts/ops/load_period_pack.py"
      - "scripts/ops/verify_disposable_period_pack.py"
      - "tests/test_period_pack_loader.py"
      - ".github/workflows/period-pack-runtime.yml"

permissions:
  contents: read

concurrency:
  group: period-pack-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  period-pack-runtime:
    name: Generic Period Pack Loader Runtime Proof (F4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit and contract tests
        run: python -m unittest tests/test_period_pack_loader.py tests/test_verifier_do_scope.py -v

      - uses: docker/setup-buildx-action@v3

      - name: Build cached Odoo image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fmcg-odoo:ci
          cache-from: type=gha,scope=odoo-ci-${{ github.job }}
          cache-to: type=gha,mode=max,scope=odoo-ci-${{ github.job }},ignore-error=true

      - name: Inisialisasi basis Odoo pada database ci_db
        run: |
          set -o pipefail
          docker run --rm -v ui-filestore:/var/lib/odoo --network host --entrypoint bash fmcg-odoo:ci -c '
            odoo -d ci_db --db_host localhost --db_port 5432 -r odoo -w odoo \
              --addons-path "$(/opt/deploy/addons_path.sh)" --without-demo=true \
              -i id_base,id_approval,id_ui_form,id_mobile_api,id_promo_governance,id_dashboard_monetary,id_dashboard_wms,id_dashboard_sales,sale_management,account,fleet,l10n_id,l10n_id_efaktur_coretax --stop-after-init --log-level=warn
          ' 2>&1 | tee odoo-init.log

      - name: F4 Generic period pack loader runtime proof (two disposable databases)
        run: |
          set -o pipefail
          docker run --rm -v ui-filestore:/var/lib/odoo --network host -v "$PWD":/workspace -w /workspace --entrypoint bash fmcg-odoo:ci -c '
            set -euo pipefail
            copy_filestore() {
              local src="$1"
              local dst="$2"
              for f_root in /var/lib/odoo/filestore /var/lib/odoo/.local/share/Odoo/filestore /root/.local/share/Odoo/filestore; do
                if [ -d "$f_root/$src" ]; then
                  mkdir -p "$f_root/$dst"
                  cp -r "$f_root/$src"/* "$f_root/$dst"/ 2>/dev/null || true
                fi
              done
            }

            PGPASSWORD=odoo createdb -h localhost -p 5432 -U odoo -T ci_db fmcg_period_master
            copy_filestore ci_db fmcg_period_master

            echo "Memuat data master FMCG (150 SKU, vendor, partner outlet) ke fmcg_period_master..."
            odoo shell -d fmcg_period_master --db_host localhost --db_port 5432 -r odoo -w odoo \
              --data-dir /var/lib/odoo --addons-path "$(/opt/deploy/addons_path.sh)" --no-http < scripts/load_fmcg_seed.py

            # Database B (Scenario B): master-only baseline (150 SKU terverifikasi, 0 transaksi)
            PGPASSWORD=odoo createdb -h localhost -p 5432 -U odoo -T fmcg_period_master fmcg_period_disposable_b
            copy_filestore fmcg_period_master fmcg_period_disposable_b

            # Database A (Scenario A): clone dari master dan bootstrap baseline transaksi Juli
            PGPASSWORD=odoo createdb -h localhost -p 5432 -U odoo -T fmcg_period_master fmcg_period_disposable
            copy_filestore fmcg_period_master fmcg_period_disposable
            echo "Bootstrapping baseline transaksi kanonikal Juli ke fmcg_period_disposable..."
            odoo shell -d fmcg_period_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --data-dir /var/lib/odoo --addons-path "$(/opt/deploy/addons_path.sh)" --no-http < scripts/load_canonical_perpetual.py

            echo "Memvalidasi carry-forward 1 Agustus pada fmcg_period_disposable..."
            CANONICAL_CUTOFF_DATE=2026-08-01 odoo shell -d fmcg_period_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --data-dir /var/lib/odoo --addons-path "$(/opt/deploy/addons_path.sh)" --no-http < scripts/load_canonical_perpetual.py

            echo "Menjalankan verify_disposable_period_pack.py pada fmcg_period_disposable dan fmcg_period_disposable_b..."
            PERIOD_PACK_DIR="data/registers/periods/2026-08" \
            PERIOD_SCENARIO="all" \
            PERIOD_DB_B="fmcg_period_disposable_b" \
            PERIOD_OUT="period_pack_runtime_report.json" \
            odoo shell -d fmcg_period_disposable --db_host localhost --db_port 5432 -r odoo -w odoo \
              --data-dir /var/lib/odoo --addons-path "$(/opt/deploy/addons_path.sh)" --no-http \
              < scripts/ops/verify_disposable_period_pack.py

            PGPASSWORD=odoo dropdb -h localhost -p 5432 -U odoo fmcg_period_master || true
            PGPASSWORD=odoo dropdb -h localhost -p 5432 -U odoo fmcg_period_disposable || true
            PGPASSWORD=odoo dropdb -h localhost -p 5432 -U odoo fmcg_period_disposable_b || true
            rm -rf /var/lib/odoo/filestore/fmcg_period_master /var/lib/odoo/filestore/fmcg_period_disposable /var/lib/odoo/filestore/fmcg_period_disposable_b /root/.local/share/Odoo/filestore/fmcg_period_master /root/.local/share/Odoo/filestore/fmcg_period_disposable /root/.local/share/Odoo/filestore/fmcg_period_disposable_b || true
          ' 2>&1 | tee period-pack-runtime.log
          grep -q 'STATUS: RUNTIME VERIFICATION COMPLETED SUCCESSFULLY.' period-pack-runtime.log
          if grep -E ' (ERROR|CRITICAL) |Traceback' period-pack-runtime.log; then exit 1; fi

      - name: Upload period pack runtime proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: period-pack-runtime-report
          path: |
            period-pack-runtime.log
            period_pack_runtime_report.json
          retention-days: 14
