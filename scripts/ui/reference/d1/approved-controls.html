  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#d1-filter-simulation .id-dash-host {
  --ac:#1f5fbf;
  --ac2:#7fa8e6;
  --ac3:#bcd3f2;
  --dk:#0b2a66;
  --hl:#0aa5c0;
  --tint:#eaf1fb;
  --tint2:#eef3fb;
  --chip:#dce8f9;
  --line:#d5e0f2;
  --chart-0:var(--ac);
  --chart-1:var(--ac2);
  --chart-2:var(--hl);
  --chart-3:var(--ac3);
  --chart-4:#919aaa;
  --chart-5:#c8ced8;
  font-family: Inter,system-ui,sans-serif;
  color: #12223f;
  font-size: 13px;
  min-width: 0;
  container-type: inline-size; }
  #d1-filter-simulation .id-dash-host * {
    box-sizing: border-box; }
  #d1-filter-simulation .id-dash-host button, #d1-filter-simulation .id-dash-host input, #d1-filter-simulation .id-dash-host select {
    font: inherit; }
  #d1-filter-simulation .id-dash-host button:focus-visible, #d1-filter-simulation .id-dash-host a:focus-visible, #d1-filter-simulation .id-dash-host input:focus-visible, #d1-filter-simulation .id-dash-host select:focus-visible {
    outline: 2px solid var(--ac);
    outline-offset: 2px; }
  #d1-filter-simulation .id-dash-host h3 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
    border-left: 3px solid var(--dk);
    padding-left: 8px; }
  #d1-filter-simulation .id-dash-host .id-dash-page {
    max-width: none !important;
    min-height: 0 !important; }
  #d1-filter-simulation .id-dash-host .id-dash-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0; }
  #d1-filter-simulation .id-dash-host .id-dash-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    min-width: 0; }
  #d1-filter-simulation .id-dash-host .id-coverage-body {
    display: grid;
    grid-template-columns: 400px minmax(0, 1fr);
    gap: 14px;
    align-items: start; }
  #d1-filter-simulation .id-dash-host .id-gauge {
    min-height: 210px;
    text-align: center; }
  #d1-filter-simulation .id-dash-host .id-gauge h3 {
    text-align: left; }
  #d1-filter-simulation .id-dash-host .id-gauge svg {
    width: 220px;
    max-width: 100%;
    height: 126px; }
  #d1-filter-simulation .id-dash-host .id-gauge-value {
    font-size: 25px;
    fill: #12223f;
    font-weight: 700; }
  #d1-filter-simulation .id-dash-host .id-gauge p, #d1-filter-simulation .id-dash-host .id-gauge footer {
    font-size: 11px;
    margin: 3px 0;
    color: #52627f; }
  #d1-filter-simulation .id-dash-host .is-good {
    color: #1a7f4b; }
  #d1-filter-simulation .id-dash-host .is-bad {
    color: #b3261e; }
  #d1-filter-simulation .id-dash-host .id-donut-body {
    display: flex;
    gap: 16px;
    align-items: center;
    height: calc(100% - 27px);
    min-height: 130px; }
  #d1-filter-simulation .id-dash-host .id-donut-ring {
    position: relative;
    width: 140px;
    flex: none; }
  #d1-filter-simulation .id-dash-host .id-donut-ring svg {
    display: block;
    width: 100%; }
  #d1-filter-simulation .id-dash-host .id-donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; }
  #d1-filter-simulation .id-dash-host .id-donut-center b {
    font-size: 16px; }
  #d1-filter-simulation .id-dash-host small {
    font-size: 10.5px;
    color: #52627f; }
  #d1-filter-simulation .id-dash-host .id-donut-legend {
    flex: 1;
    min-width: 0;
    font-size: 11px; }
  #d1-filter-simulation .id-dash-host .id-donut-legend &gt; div {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0; }
  #d1-filter-simulation .id-dash-host .id-donut-legend &gt; div &gt; span:last-child {
    margin-left: auto;
    white-space: nowrap; }
  #d1-filter-simulation .id-dash-host .id-donut-legend i, #d1-filter-simulation .id-dash-host .id-chart-legend i {
    width: 10px;
    height: 10px;
    display: inline-block;
    border-radius: 2px;
    flex: none; }
  #d1-filter-simulation .id-dash-host .id-chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    font-size: 10px;
    color: #52627f;
    margin: 0 0 18px; }
  #d1-filter-simulation .id-dash-host .id-chart-legend span {
    display: flex;
    align-items: center;
    gap: 4px; }
  #d1-filter-simulation .id-dash-host .id-stack-row {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr) 80px;
    align-items: center;

    (function(){
const {Component,useState}=owl;
/** @odoo-module **/
const safeGeometry = {
    series(values) {
        const clean = (values || []).filter(Number.isFinite);
        return clean.length ? clean : [0];
    },
    ratio(value, max) {
        return Number.isFinite(value) &amp;&amp; Number.isFinite(max) &amp;&amp; max &gt; 0
            ? Math.max(0, Math.min(100, (100 * value) / max))
            : 0;
    },
};

/** @odoo-module **/

class VisualComponent extends Component {
    static props = [&quot;*&quot;];
    get v() {
        return this.renderVals();
    }
    emit(kind, payload = {}) {
        this.props.onEvent?.({ kind, ...payload });
    }
    handleClick(ev) {
        const button = ev.target.closest(&quot;button[data-command]&quot;);
        if (button) this.emit(button.dataset.command);
    }
}

/** @odoo-module **/


class DashHeader extends VisualComponent {
    static props = {
        title: { type: String, optional: false },
        sub: { type: String, optional: true },
        sync: { type: String, optional: true },
        role: { type: String, optional: true },
        onEvent: { type: Function, optional: true },
        onDrill: { type: Function, optional: true },
    };
    static template = &quot;id_dashboard_ui.DashHeader&quot;;
    renderVals() {
        const p = this.props;
        return {
            title: p.title || &quot;Judul dashboard&quot;,
            sub: p.sub || &quot;&quot;,
            sync: p.sync || &quot;—&quot;,
            role: p.role || &quot;—&quot;,
        };
    }
}

/** @odoo-module **/


class KpiCard extends VisualComponent {
    static props = {
        kpi: { type: Object, optional: false },
        onEvent: { type: Function, optional: true },
        onDrill: { type: Function, optional: true },
    };
    static template = &quot;id_dashboard_ui.KpiCard&quot;;
    renderVals() {
        const k = this.props.kpi || {
            label: &quot;Metrik&quot;,
            num: &quot;—&quot;,
            spark: [],
            delta: &quot;&quot;,
            good: true,
        };
        const Ci = (x, y, r) =&gt;
            `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
        const I = {
            chart: &quot;M4 20V10M10 20V4M16 20v-8M22 20H2&quot;,
            undo: &quot;M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3&quot;,
            wallet: &quot;M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7zM3 7l12-3v3M16 14h3&quot;,
            target: Ci(12, 12, 9) + Ci(12, 12, 4.5),
            phone: &quot;M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z&quot;,
            clock: Ci(12, 12, 9) + &quot;M12 7v5l3 2&quot;,
            cart:
                &quot;M3 4h2l2.5 11h10L20 8H6.5&quot; + Ci(9, 19, 1.4) + Ci(17, 19, 1.4),
            pct: &quot;M19 5L5 19&quot; + Ci(7, 7, 2.3) + Ci(17, 17, 2.3),
            store: &quot;M4 9l1.5-5h13L20 9M4 9v11h16V9M9 20v-6h6v6&quot;,
            truck:
                &quot;M2 6h11v10H2zM13 9h4l3 3v4h-7&quot; + Ci(7, 18, 2) + Ci(17, 18, 2),
            box: &quot;M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10&quot;,
            cash: &quot;M2 7h20v10H2z&quot; + Ci(12, 12, 2.5),
            alert: &quot;M12 3l10 18H2zM12 10v5M12 18v.5&quot;,
            calendar: &quot;M4 6h16v14H4zM4 10h16M8 3v4M16 3v4&quot;,
            users:
                Ci(9, 8, 3) +
                &quot;M3 20a6 6 0 0112 0M17 8a3 3 0 010 6M21 20a5 5 0 00-4-5&quot;,
            layers: &quot;M12 3l9 5-9 5-9-5zM3 13l9 5 9-5&quot;,
            trend: &quot;M3 17l6-6 4 4 8-8M15 7h6v6&quot;,
            flag: &quot;M5 21V4M5 4h12l-2 4 2 4H5&quot;,
        };
        const sp = safeGeometry.series(k.spark),
            mx = Math.max(...sp),
            mn = Math.min(...sp);
        const pts = sp
            .map(
                (x, i) =&gt;
                    `${((i * 100) / Math.max(1, sp.length - 1)).toFixed(1)},${(34 - ((x - mn) / (mx - mn || 1)) * 30).toFixed(1)}`,
            )
            .join(&quot; &quot;);
        let h = 0;
        for (const ch of String(k.label)) h = (h * 31 + ch.charCodeAt(0)) | 0;
        const up = String(k.delta).startsWith(&quot;+&quot;);
        return {
            icon: I[k.icon] || I.chart,
            label: k.label,
            menuLabel: &quot;Menu drill-down: &quot; + k.label,
            gid: &quot;id-kpi-&quot; + this.__owl__.id + &quot;-&quot; + Math.abs(h),
            col: k.good ? &quot;#1a7f4b&quot; : &quot;#b3261e&quot;,
            pts,
            hasPre: !!k.pre,
            pre: k.pre || &quot;&quot;,
            hasCur: !!k.cur,
            cur: k.cur || &quot;&quot;,
            num: k.num,
            unit: k.unit || &quot;&quot;,
            hasBar: k.bar != null,
            bar: k.bar || 0,
            delta: k.delta,
            txt: k.txt || &quot;&quot;,
            arrow: up ? &quot;M12 19V5M6 11l6-6 6 6&quot; : &quot;M12 5v14M6 13l6 6 6-6&quot;,
        };
    }
}

/** @odoo-module **/


class BarRows extends VisualComponent {
    static props = {
        title: { type: String, optional: true },
        rows: { type: Array, optional: false },
        cols: { type: [String, Number], optional: true },
        rowH: { type: [String, Number], optional: true },
        height: { type: [String, Number], optional: true },
        bare: { type: [String, Boolean], optional: true },
        headL: { type: String, optional: true },
        headR: { type: String, optional: true },
        foot: { type: String, optional: true },
        max: { type: [String, Number], optional: true },
        onEvent: { type: Function, optional: true },
        onDrill: { type: Function, optional: true },
    };
    openRow(row) {
        if (row.drill) this.props.onDrill?.(row.drill);
    }
    rowKey(ev, row) {
        if (ev.key === &quot;Enter&quot; || ev.key === &quot; &quot;) this.openRow(row);
    }
    static template = &quot;id_dashboard_ui.BarRows&quot;;
    renderVals() {
        const p = this.props;
        const rows = p.rows || [];
        const cols = +(p.cols || 1),
            rowH = +(p.rowH || 0),
            bare = p.bare === &quot;true&quot; || p.bare === true;
        const data = rows.filter((r) =&gt; !r.total);
        const mx = +(p.max || Math.max(...data.map((r) =&gt; r.v), 1));
        const first = rows.findIndex((r) =&gt; !r.total);
        const items = rows.map((r, i) =&gt; ({
            n: r.n,
            t: r.t,
            drill: r.drill,
            tip: r.tip || &quot;&quot;,
            w: r.total ? 0 : ((r.v / mx) * 100).toFixed(1),
            fill: r.c || (i === first ? &quot;var(--ac2)&quot; : &quot;var(--ac3)&quot;),
            bg: r.total ? &quot;transparent&quot; : &quot;var(--tint2)&quot;,
            bt: r.total ? &quot;1px solid #d5e0f2&quot; : &quot;0&quot;,
            rad: r.total ? &quot;0&quot; : &quot;4px&quot;,
            fw: r.total ? 700 : 600,
        }));
        const per = Math.max(1, Math.ceil(items.length / cols));
        return {
            card: bare
                ? &quot;&quot;
                : &quot;background:#fff;border:1px solid #d5e0f2;border-radius:6px;padding:12px 14px;&quot;,
            hh: p.height ? p.height + &quot;px&quot; : &quot;auto&quot;,
            showTitle: !bare &amp;&amp; !!p.title,
            title: p.title || &quot;&quot;,
            showHead: !!p.headL,
            heads: Array.from({ length: cols }, () =&gt; ({
                l: p.headL || &quot;&quot;,
                r: p.headR || &quot;&quot;,
            })),
            gtc: `repeat(${cols},minmax(0,1fr))`,
            gtr: rowH
                ? `repeat(${per},${rowH}px)`
                : `repeat(${per},minmax(22px,1fr))`,
            items,
            showFoot: !!p.foot,
            foot: p.foot || &quot;&quot;,
        };
    }
}

/** @odoo-module **/


class TrendChart extends VisualComponent {
    static props = {
        title: { type: String, optional: true },
        series: { type: Array, optional: false },
        legend: { type: Array, optional: true },
        target: { type: [String, Number], optional: true },
        min: { type: [String, Number], optional: true },
        max: { type: [String, Number], optional: true },
        ticks: { type: Array, optional: true },
        xl: { type: Array, optional: true },
        unit: { type: String, optional: true },
        height: { type: [String, Number], optional: true },
        onEvent: { type: Function, optional: true },
        onDrill: { type: Function, optional: true },
    };
    static template = &quot;id_dashboard_ui.TrendChart&quot;;
    renderVals() {
        const p = this.props;
        const s = p.series || [{ v: [] }, { v: [] }];
        const mn = +(p.min || 0),
            mx = +(p.max || 20);
        const n = Math.max(1, ...s.map((a) =&gt; a.v.length));
        const X = (i) =&gt; (i / Math.max(1, n - 1)) * 100;
        const Y = (v) =&gt; 100 - ((v - mn) / (mx - mn || 1)) * 100;
        const pt = (a) =&gt;
            a.v
                .map((v, i) =&gt; `${X(i).toFixed(2)},${Y(v).toFixed(2)}`)
                .join(&quot; &quot;);
        const s1 = s[0] || { v: [] },
            s2 = s[1] || { v: [] };
        const hasT = p.target != null &amp;&amp; p.target !== &quot;&quot;;
        const ticks = (p.ticks || [mn, mx]).map((v) =&gt; ({
            t: String(v),
            top: Y(v).toFixed(1),
        }));
        const lg = (p.legend || []).map((g) =&gt; ({
            t: g.t,
            bd: (g.d ? &quot;2px dashed &quot; : &quot;3px solid &quot;) + g.c,
        }));

        onEvent: { type: Function, optional: true },
        onDrill: { type: Function, optional: true },
    };
    setup() {
        this.view = useState({
            vb: [...(this.props.vb || [54.2, 172.8, 99.8, 82.4])],
        });
        this.drag = null;
    }
    zoom(factor) {
        const [x, y, w, h] = this.view.vb;
        const width = Math.max(5, Math.min(500, w * factor));
        const height = (h * width) / w;
        this.view.vb = [
            x + (w - width) / 2,
            y + (h - height) / 2,
            width,
            height,
        ];
    }
    mapClick(ev) {
        const command = ev.target.closest(&quot;button&quot;)?.dataset.command;
        if (command === &quot;in&quot;) this.zoom(0.8);
        if (command === &quot;out&quot;) this.zoom(1.25);
        if (command === &quot;reset&quot;) this.view.vb = [0, 0, 250, 278.1];
        const code = ev.target.closest(&quot;[data-code]&quot;)?.dataset.code;
        if (code) this.props.onDrill?.({ dimension: &quot;city_code&quot;, code });
    }
    startPan(ev) {
        if (ev.button !== 0 || ev.target.closest(&quot;button&quot;)) return;
        this.drag = { x: ev.clientX, y: ev.clientY, vb: [...this.view.vb] };
        ev.currentTarget.setPointerCapture?.(ev.pointerId);
    }
    movePan(ev) {
        if (!this.drag) return;
        const box = ev.currentTarget.getBoundingClientRect();
        const d = this.drag;
        this.view.vb = [
            d.vb[0] - ((ev.clientX - d.x) / box.width) * d.vb[2],
            d.vb[1] - ((ev.clientY - d.y) / box.height) * d.vb[3],
            d.vb[2],
            d.vb[3],

    }
