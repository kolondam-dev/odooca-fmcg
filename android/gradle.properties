org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Alamat backend Odoo (WAJIB diisi per lingkungan, tanpa garis miring di akhir).
# Isi di ~/.gradle/gradle.properties atau lewat -Podooca.baseUrl=https://host
odooca.baseUrl=
# Nama database Odoo (kosongkan bila server hanya memiliki satu database).
odooca.database=

# AGP 9 defaults to built-in Kotlin and the new DSL. Both opt-outs are required
# together while the project still applies org.jetbrains.kotlin.android; the
# migration is tracked separately because it changes every module's plugin block.
android.builtInKotlin=false
android.newDsl=false
