org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Alamat backend Odoo (WAJIB diisi per lingkungan, tanpa garis miring di akhir).
# Isi di ~/.gradle/gradle.properties atau lewat -Podooca.baseUrl=https://host
odooca.baseUrl=
# Nama database Odoo (kosongkan bila server hanya memiliki satu database).
odooca.database=

# AGP 9 defaults to built-in Kotlin and the new DSL. Both opt-outs are required
# together while the project still applies org.jetbrains.kotlin.android; the
# migration is tracked separately because it changes every module's plugin block.
android.builtInKotlin=false
android.newDsl=false

# Repository operations occasionally fail transiently on CI (KSP plugin
# resolution in PR #162 and #173) even though the artifacts are available.
# Gradle defaults (3 attempts, 125 ms initial backoff) are too tight, so widen
# them to 5 attempts and 1 s. These are internal Gradle system properties, not
# public API, and they only widen retries; they never change dependency
# versions or bypass verification.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
